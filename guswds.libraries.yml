common:
  js:
    dist/js/common.js: {}

global:
  css:
    # Base so SDC component CSS (weight 0) loads after global resets/element
    # styles (weight -200). Declaring guswds/global as an SDC dependency is not
    # enough — see https://www.drupal.org/project/drupal/issues/3560103
    base:
      dist/css/styles.css: {}
    state:
      dist/css/utilities.css: {}
  js:
    dist/js/html.es6.js: {}
    dist/js/uswds-init.es6.js: {}
    dist/js/uswds.es6.js: {}
  dependencies:
    - core/drupal
    - core/once
    - guswds/common

react:
  js:
    # Setting preprocess to false is important since we're using
    # code-spliting (lazy()) in our React code. If Drupal's
    # JS aggregation is turned on, only the main.js file will
    # get aggregated. The split code won't and Drupal will
    # erroneously try to load it from /sites/default/files/js.
    dist/js/react/main.js: { preprocess: false }
  dependencies:
    - core/drupalSettings
