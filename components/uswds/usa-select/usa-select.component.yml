$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'USWDS Select'
description: 'See https://designsystem.digital.gov/components/select/.'
status: experimental
props:
  type: object
  properties:
    modifier_classes:
      type:
        - string
        - "null"
      title: Modifier Classes
      description: 'Additional CSS classes to add to the component.'
    dropdown_id:
      type:
        - string
        - "null"
      title: ID
      description: 'ID and name of the select.'
    dropdown_label:
      type:
        - string
        - "null"
      title: Label
      description: 'Label text.'
    dropdown_disabled:
      type:
        - boolean
        - "null"
      title: Disabled
      description: 'Whether the select is disabled.'
    dropdown_options:
      type:
        - array
        - "null"
      title: Options
      description: 'Array of options, each with a value, label and optional disabled key.'
libraryOverrides:
  dependencies:
    - guswds/global
