$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'USWDS Accordion'
description: 'See https://designsystem.digital.gov/components/accordion/.'
status: experimental
props:
  type: object
  properties:
    modifier_classes:
      type:
        - string
        - "null"
      title: Modifier Classes
      description: 'Additional CSS classes to add to the component.'
    accordion_id:
      type:
        - string
        - "null"
      title: Accordion ID
      description: 'Unique ID prefix for the accordion panels. Generated if not provided.'
    is_multi_selectable:
      type:
        - boolean
        - "null"
      title: Multiselectable
      description: 'Whether multiple panels can be open at once.'
    accordion:
      type:
        - array
        - "null"
      title: Accordion Items
      description: 'Array of items, each with a title and content.'
libraryOverrides:
  dependencies:
    - guswds/global
