$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'USWDS Tag'
description: 'See https://designsystem.digital.gov/components/tag/.'
status: experimental
props:
  type: object
  properties:
    modifier_classes:
      type:
        - string
        - "null"
      title: Modifier Classes
      description: 'Additional CSS classes to add to the component.'
    text:
      type:
        - string
        - "null"
      title: Text
      description: 'Tag text.'
libraryOverrides:
  dependencies:
    - guswds/global
