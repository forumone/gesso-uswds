$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'USWDS Alert'
description: 'See https://designsystem.digital.gov/components/alert/.'
status: experimental
props:
  type: object
  properties:
    modifier_classes:
      type:
        - string
        - "null"
      title: Modifier Classes
      description: 'Additional CSS classes to add to the component.'
    role:
      type:
        - string
        - "null"
      title: Role
      description: 'ARIA role for the alert (e.g., alert, status).'
    title:
      type:
        - string
        - "null"
      title: Title
      description: 'Alert heading.'
    content:
      type:
        - string
        - "null"
      title: Content
      description: 'Alert body content.'
libraryOverrides:
  dependencies:
    - guswds/global
