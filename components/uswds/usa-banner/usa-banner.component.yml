$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'USWDS Banner'
description: 'See https://designsystem.digital.gov/components/banner/.'
status: experimental
props:
  type: object
  properties:
    modifier_classes:
      type:
        - string
        - "null"
      title: Modifier Classes
      description: 'Additional CSS classes to add to the component.'
    language:
      type:
        - string
        - "null"
      title: Language
      description: 'Language of the banner text. Use ''es'' for Spanish; defaults to English.'
    has_expanded:
      type:
        - boolean
        - "null"
      title: Has Expanded Content
      description: 'Whether to include the expandable "Here’s how you know" content.'
    image_path:
      type:
        - string
        - "null"
      title: Image Path
      description: 'Path to the theme images directory.'
libraryOverrides:
  dependencies:
    - guswds/global
