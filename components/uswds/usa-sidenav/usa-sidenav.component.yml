$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'USWDS Side Navigation'
description: 'See https://designsystem.digital.gov/components/side-navigation/.'
status: experimental
props:
  type: object
  properties:
    modifier_classes:
      type:
        - string
        - "null"
      title: Modifier Classes
      description: 'Additional CSS classes to add to the component.'
    label:
      type:
        - string
        - "null"
      title: Label
      description: 'ARIA label of the menu.'
libraryOverrides:
  dependencies:
    - guswds/global
