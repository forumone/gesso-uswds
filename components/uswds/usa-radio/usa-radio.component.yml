$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'USWDS Radio Button'
description: 'See https://designsystem.digital.gov/components/radio-buttons/.'
status: experimental
props:
  type: object
  properties:
    modifier_classes:
      type:
        - string
        - "null"
      title: Modifier Classes
      description: 'Additional CSS classes to add to the component.'
    radio_tile:
      type:
        - boolean
        - "null"
      title: Tile
      description: 'Use the tile variant.'
    radio_id:
      type:
        - string
        - "null"
      title: ID
      description: 'ID of the radio input.'
    radio_name:
      type:
        - string
        - "null"
      title: Name
      description: 'Name of the radio input.'
    radio_value:
      type:
        - string
        - "null"
      title: Value
      description: 'Value of the radio input.'
    radio_checked:
      type:
        - boolean
        - "null"
      title: Checked
      description: 'Whether the radio is checked.'
    radio_disabled:
      type:
        - boolean
        - "null"
      title: Disabled
      description: 'Whether the radio is disabled.'
    radio_label:
      type:
        - string
        - "null"
      title: Label
      description: 'Radio label text.'
libraryOverrides:
  dependencies:
    - guswds/global
